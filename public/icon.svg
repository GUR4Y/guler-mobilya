<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="100" y1="90" x2="412" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6E7CE"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7722"/>
