  </defs>

  <!-- Arka Plan Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.45"/>

